name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - "HK_Software_Guide.tex"
      - "fiTQun_WCSim_env.sh"
      - "fiTQun_WCSim.def"
      - "docs/**"
      - "containers/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check LaTeX input files
        run: |
          test -f HK_Software_Guide.tex
          test -f fiTQun_WCSim_env.sh
          test -f fiTQun_WCSim.def

      - name: Compile LaTeX guide
        uses: xu-cheng/latex-action@v3
        with:
          root_file: HK_Software_Guide.tex
          compiler: latexmk

      - name: Copy PDF into Sphinx static directory
        run: |
          mkdir -p docs/_static
          cp HK_Software_Guide.pdf docs/_static/HK_Software_Guide.pdf

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.9"
          channels: conda-forge
          activate-environment: docs-env

      - name: Install documentation dependencies
        shell: bash -l {0}
        run: |
          conda activate docs-env
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build HTML docs
        shell: bash -l {0}
        env:
          MPLBACKEND: Agg
        run: |
          conda activate docs-env
          sphinx-build -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
